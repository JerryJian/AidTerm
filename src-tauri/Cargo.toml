[package]
name = "aidterm"
version = "0.1.0"
description = "A cross-platform terminal emulator"
authors = ["you"]
edition = "2021"

[lib]
name = "aidterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
russh = { version = "0.62", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "2.3.0"
anyhow = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-util", "net", "fs"] }
futures = "0.3"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
telnet = "0.2"
tokio-socks = "0.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
encoding_rs = "0.8"
log = "0.4"
env_logger = "0.11"
ring = "0.17"
base64 = "0.22"
async-openai = { version = "0.41", default-features = false, features = ["chat-completion", "model"] }
ollama-rs = "0.3"
anthropic-ai-sdk = "0.2"
tokio-serial = "5.5"
