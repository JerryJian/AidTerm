name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: false
        default: all
        type: choice
        options:
          - all
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc

permissions:
  contents: write

jobs:
  build-tauri:
    name: Build Tauri ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            xdg-utils

      # Google publishes only x86_64 Linux platform-tools, so the aarch64
      # target skips bundling adb and falls back to PATH (bundling the x86_64
      # binary into an arm64 package would break at runtime).
      - name: Fetch adb
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: npm run fetch-adb

      - name: Fetch scrcpy-server
        run: npm run fetch-scrcpy

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target ${{ matrix.target }}

      - name: Rename artifacts to release convention
        shell: bash
        run: |
          cd "src-tauri/target/${{ matrix.target }}/release/bundle"
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)
              for f in deb/*.deb; do case "$f" in *_amd64.deb) mv "$f" "${f/_amd64/_x64}";; esac; done
              for f in appimage/*.AppImage; do case "$f" in *_amd64.AppImage) mv "$f" "${f/_amd64/_x64}";; *_x86_64.AppImage) mv "$f" "${f/_x86_64/_x64}";; esac; done
              ;;
            aarch64-unknown-linux-gnu)
              for f in appimage/*.AppImage; do case "$f" in *_aarch64.AppImage) mv "$f" "${f/_aarch64/_arm64}";; esac; done
              ;;
            aarch64-apple-darwin)
              rm -f macos/*.app.tar.gz* macos/*.sig
              for f in dmg/*.dmg; do case "$f" in *_aarch64.dmg) mv "$f" "${f/_aarch64/_arm64}";; esac; done
              ;;
            x86_64-pc-windows-msvc)
              for f in nsis/*.exe; do case "$f" in *-setup.exe) mv "$f" "${f/-setup/_setup}";; esac; done
              ;;
          esac

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: tauri-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
          if-no-files-found: error

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: tauri-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
          if-no-files-found: error

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: tauri-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
          if-no-files-found: error

  build-electron:
    name: Build Electron ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
            container: node:20-bullseye
          - runner: ubuntu-22.04-arm
            target: linux-arm64
            container: node:20-bullseye
          - runner: macos-15
            target: macos-arm64
          - runner: windows-2022
            target: windows-x64

    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Electron dependencies
        working-directory: src-electron
        run: npm ci --omit=optional

      - name: Build Electron TypeScript
        working-directory: src-electron
        run: npm run build

      - name: Install native modules (Linux)
        if: runner.os == 'Linux'
        working-directory: src-electron
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=''; fi
          $SUDO apt-get update -qq
          $SUDO apt-get install -y --no-install-recommends \
            build-essential \
            python3 \
            unzip \
            libx11-dev \
            libxtst-dev \
            libpng-dev \
            libffi-dev \
            libudev-dev
          npx electron-builder install-app-deps

      # Fetch the platform-matched adb so the Electron package ships it (Cast /
      # scrcpy is Tauri-only, so it is not fetched here). The Linux container
      # gets `unzip` from the native-modules step above; linux-arm64 skips adb
      # and falls back to PATH since Google ships no official arm64 platform-tools.
      - name: Fetch adb
        if: matrix.target != 'linux-arm64'
        run: npm run fetch-adb

      - name: Build Electron app (Linux)
        if: runner.os == 'Linux'
        working-directory: src-electron
        run: npx electron-builder --linux --${{ matrix.target == 'linux-arm64' && 'arm64' || 'x64' }}

      - name: Rename artifacts (Linux)
        if: runner.os == 'Linux'
        working-directory: src-electron
        shell: bash
        run: |
          for f in out/*.deb; do case "$f" in *_amd64.deb) mv "$f" "${f/_amd64/_x64}";; esac; done

      - name: Build Electron app (macOS)
        if: runner.os == 'macOS'
        working-directory: src-electron
        run: npx electron-builder --mac --${{ matrix.target == 'macos-arm64' && 'arm64' || 'x64' }}

      - name: Install Spectre-mitigated libs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          Start-Process -FilePath $setupExe -ArgumentList "modify --installPath `"$installPath`" --add Microsoft.VisualStudio.Component.VC.Runtimes.x64.Spectre --quiet --norestart --nocache" -Wait -NoNewWindow

      - name: Build Electron app (Windows)
        if: runner.os == 'Windows'
        working-directory: src-electron
        run: npx electron-builder --win --x64

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: electron-${{ matrix.target }}
          path: |
            src-electron/out/*.AppImage
            src-electron/out/*.deb
          if-no-files-found: error

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: electron-${{ matrix.target }}
          path: |
            src-electron/out/*.dmg
          if-no-files-found: error

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: electron-${{ matrix.target }}
          path: |
            src-electron/out/*.exe
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-tauri, build-electron]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Tauri artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: tauri-*
          merge-multiple: true
          path: artifacts/tauri

      - name: Download Electron artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: electron-*
          merge-multiple: true
          path: artifacts/electron

      - name: List release assets
        run: find artifacts -type f | sort

      - name: Build release body
        id: body
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = context.ref.replace('refs/tags/v', '');
            let notes;
            try {
              notes = fs.readFileSync(`releases/ReleaseNotes-${version}.md`, 'utf8').trim();
            } catch {
              notes = `No release notes found for v${version}.`;
            }
            const body = [
              notes,
              '',
              '---',
              '',
              `- Commit: \`${context.sha}\``,
              `- Workflow run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '## Downloads',
              '',
              '### Tauri (Recommended)',
              '',
              '| Platform | File |',
              '|----------|------|',
              '| Windows (x64) | `AidTerm_*_x64_setup.exe` + `AidTerm_*_x64_en-US.msi` |',
              '| Linux (x64) | `AidTerm_*_x64.deb` + `AidTerm_*_x64.AppImage` |',
              '| Linux (ARM64) | `AidTerm_*_arm64.deb` + `AidTerm_*_arm64.AppImage` |',
              '| macOS (Apple Silicon) | `AidTerm_*_arm64.dmg` |',
              '',
              '### Electron',
              '',
              '| Platform | File |',
              '|----------|------|',
              '| Windows (x64) | `AidTerm_electron_*_x64_setup.exe` |',
              '| Linux (x64) | `AidTerm_electron_*_x64.deb` + `AidTerm_electron_*_x64.AppImage` |',
              '| Linux (ARM64) | `AidTerm_electron_*_arm64.deb` + `AidTerm_electron_*_arm64.AppImage` |',
              '| macOS (Apple Silicon) | `AidTerm_electron_*_arm64.dmg` |',
              '',
            ].join('\n');
            fs.writeFileSync('release-body.md', body);
            core.setOutput('body-file', 'release-body.md');

      - name: Delete stale draft release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data: releases } = await octokit.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const stale = releases.find(r => r.tag_name === tag && r.draft);
            if (stale) {
              await octokit.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: stale.id,
              });
              core.notice(`Deleted stale draft release ${stale.id} for tag ${tag}`);
            }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "AidTerm ${{ github.ref_name }}"
          body_path: ${{ steps.body.outputs.body-file }}
          files: |
            artifacts/tauri/**/*.exe
            artifacts/tauri/**/*.deb
            artifacts/tauri/**/*.dmg
            artifacts/tauri/**/*.AppImage
            artifacts/tauri/**/*.msi
            artifacts/electron/**/*.exe
            artifacts/electron/**/*.deb
            artifacts/electron/**/*.dmg
            artifacts/electron/**/*.AppImage
